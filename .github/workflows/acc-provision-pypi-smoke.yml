name: ACC Provision disposable production PyPI smoke

# WARNING: Pushing the exact tag below has no approval gate. After the build
# succeeds, this workflow immediately performs an irreversible real PyPI upload.
on:
  push:
    tags:
      - "081926-test-01"

permissions:
  contents: read

concurrency:
  group: acc-provision-pypi-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  ACC_PROVISION_PUBLISH_PROFILE: smoke
  GHA_TRIGGER_TAG: 081926-test-01
  RELEASE_TAG: 6.1.1.7
  SOURCE_BRANCH: codex/pypi-smoke-20260819
  EXPECTED_UPSTREAM_ID: 81c2369
  UPSTREAM_ID: ${{ vars.UPSTREAM_ID }}
  CICD_COMMIT: 2630870b2033a91c913cf0c9c04af8fa9c313284
  ACI_CONTAINERS_TAG_OBJECT: 6bad1f5ac5cd7c576c4b85b37fce583b14dc201f
  ACI_CONTAINERS_COMMIT: 854152b59d6ce589c86175bfc2b9aef49f1fc1ac
  # Legacy CICD compatibility uses the logical release, not the smoke event tag.
  TRAVIS_TAG: 6.1.1.7
  TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
  TRAVIS_REPO_SLUG: ${{ github.repository }}

jobs:
  build:
    name: Build immutable disposable package
    if: >-
      github.event_name == 'push' &&
      github.event.deleted == false &&
      github.repository == 'noironetworks/acc-provision' &&
      github.ref == 'refs/tags/081926-test-01'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}

    steps:
      - name: Check out smoke-tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact smoke tag and source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "${GITHUB_REF}" == "refs/tags/${GHA_TRIGGER_TAG}" ]]
          [[ "${GITHUB_REF_NAME}" == "${GHA_TRIGGER_TAG}" ]]
          [[ "${UPSTREAM_ID}" == "${EXPECTED_UPSTREAM_ID}" ]] || {
            echo "::error::UPSTREAM_ID must be ${EXPECTED_UPSTREAM_ID}"
            exit 1
          }
          [[ "${CICD_COMMIT}" =~ ^[0-9a-f]{40}$ &&
             "${CICD_COMMIT}" != 0000000000000000000000000000000000000000 ]] || {
            echo "::error::Replace CICD_COMMIT with the immutable companion CICD PR commit"
            exit 1
          }

          git fetch --force --no-tags origin \
            "+refs/tags/${GHA_TRIGGER_TAG}:refs/tags/${GHA_TRIGGER_TAG}"
          [[ "$(git cat-file -t "refs/tags/${GHA_TRIGGER_TAG}")" == "tag" ]] || {
            echo "::error::${GHA_TRIGGER_TAG} must be an annotated tag"
            exit 1
          }

          tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/${GHA_TRIGGER_TAG}")"
          grep -Fqi 'release to pypi.org' <<<"${tag_message}" || {
            echo "::error::Smoke tag message must contain 'release to pypi.org'"
            exit 1
          }
          if grep -Fqi 'release to test.pypi.org' <<<"${tag_message}"; then
            echo "::error::Smoke tag must route only to production PyPI"
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          tag_object="$(git rev-parse "refs/tags/${GHA_TRIGGER_TAG}")"
          source_commit="$(git rev-parse "refs/tags/${GHA_TRIGGER_TAG}^{commit}")"
          [[ "${source_commit}" == "$(git rev-parse HEAD)" ]] || {
            echo "::error::Checked-out commit does not match the smoke tag"
            exit 1
          }
          [[ "${source_commit}" == "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")" ]] || {
            echo "::error::Smoke tag must resolve to the current ${SOURCE_BRANCH} head"
            exit 1
          }
          [[ "$(cd provision && python3 setup.py --version)" == "${RELEASE_TAG}" ]] || {
            echo "::error::Smoke source must start from acc-provision ${RELEASE_TAG}"
            exit 1
          }

          {
            echo "source_commit=${source_commit}"
            echo "tag_object=${tag_object}"
          } >> "${GITHUB_OUTPUT}"
          echo "TRAVIS_COMMIT=${source_commit}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.9'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: false

      - name: Install pinned build tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install \
            pip==25.3 \
            setuptools==80.9.0 \
            wheel==0.45.1 \
            packaging==25.0 \
            twine==6.2.0

      - name: Fetch immutable CICD scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          cicd_dir="${RUNNER_TEMP}/cicd"
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --quiet --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${cicd_dir}" rev-parse HEAD)" == "${CICD_COMMIT}" ]]
          [[ "$(sed -nE 's/^RELEASE_TAG="([^"]+)"/\1/p' \
            "${cicd_dir}/travis/globals.sh")" == "${RELEASE_TAG}" ]]
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"

      - name: Build immutable acikubectl input
        shell: bash
        run: |
          set -Eeuo pipefail
          aci_dir="${RUNNER_TEMP}/aci-containers"
          git init --quiet "${aci_dir}"
          git -C "${aci_dir}" remote add origin https://github.com/noironetworks/aci-containers.git
          git -C "${aci_dir}" fetch --quiet --depth=1 --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${aci_dir}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          [[ "$(git -C "${aci_dir}" rev-parse "refs/tags/${RELEASE_TAG}")" == \
             "${ACI_CONTAINERS_TAG_OBJECT}" ]]
          [[ "$(git -C "${aci_dir}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == \
             "${ACI_CONTAINERS_COMMIT}" ]]
          git -C "${aci_dir}" checkout --quiet --detach "${ACI_CONTAINERS_COMMIT}"
          make -C "${aci_dir}" dist-static/acikubectl
          install -m 0755 "${aci_dir}/dist-static/acikubectl" provision/bin/acikubectl

      - name: Build package through shared CICD script without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          "${CICD_DIR}/travis/build-acc-provision.sh"

      - name: Validate and identify the exact source distribution
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          pushd provision
          shopt -s nullglob
          artifacts=(dist/*.tar.gz)
          shopt -u nullglob
          [[ ${#artifacts[@]} -eq 1 ]] || {
            echo "::error::Shared CICD build must produce exactly one source distribution"
            exit 1
          }
          [[ -f "${artifacts[0]}" && ! -L "${artifacts[0]}" ]]
          python3 -m twine check "${artifacts[0]}"
          artifact_sha256="$(sha256sum "${artifacts[0]}" | awk '{print $1}')"
          [[ "${artifact_sha256}" =~ ^[0-9a-f]{64}$ ]]
          artifact_name="acc-provision-pypi-smoke-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_sha256=${artifact_sha256}" >> "${GITHUB_OUTPUT}"
          popd

      - name: Upload the exact package for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: provision/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record upload inputs
        shell: bash
        run: |
          {
            echo "### Disposable production PyPI upload inputs"
            echo
            echo "- Package: noironetworks-acc-provision-release-smoke==${RELEASE_TAG}"
            echo "- SHA-256: ${{ steps.package.outputs.artifact_sha256 }}"
            echo "- Source: ${{ steps.source.outputs.source_commit }}"
            echo "- CICD scripts: ${CICD_COMMIT}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Upload once and finalize test release page
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # There is intentionally no environment approval for this one-time smoke.
    # This job starts automatically after build and uploads to real PyPI.

    steps:
      - name: Check out the smoke-tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact tag and source before upload
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${GHA_TRIGGER_TAG}:refs/tags/${GHA_TRIGGER_TAG}"
          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          [[ "$(git cat-file -t "refs/tags/${GHA_TRIGGER_TAG}")" == "tag" ]]
          [[ "$(git rev-parse "refs/tags/${GHA_TRIGGER_TAG}")" == "${{ needs.build.outputs.tag_object }}" ]]
          [[ "$(git rev-parse "refs/tags/${GHA_TRIGGER_TAG}^{commit}")" == \
             "${{ needs.build.outputs.source_commit }}" ]]
          [[ "$(git rev-parse HEAD)" == "${{ needs.build.outputs.source_commit }}" ]]
          echo "TRAVIS_COMMIT=${{ needs.build.outputs.source_commit }}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.9'

      - name: Install pinned publish and status tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install \
            pip==25.3 \
            packaging==25.0 \
            PyYAML==6.0.3 \
            pytz==2026.3.post1 \
            twine==6.2.0

      - name: Fetch the same immutable CICD scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          cicd_dir="${RUNNER_TEMP}/cicd"
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --quiet --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${cicd_dir}" rev-parse HEAD)" == "${CICD_COMMIT}" ]]
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"

      - name: Download the verified source distribution
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: provision/dist

      - name: Verify downloaded artifact before exposing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          artifacts=(provision/dist/*.tar.gz)
          shopt -u nullglob
          [[ ${#artifacts[@]} -eq 1 ]]
          [[ -f "${artifacts[0]}" && ! -L "${artifacts[0]}" ]]
          [[ "$(sha256sum "${artifacts[0]}" | awk '{print $1}')" == \
             "${{ needs.build.outputs.artifact_sha256 }}" ]]
          python3 -m twine check "${artifacts[0]}"

      - name: Publish once and finalize test release page
        shell: bash
        env:
          PYPI_USER: ${{ secrets.PYPI_USER }}
          PYPI_PASS: ${{ secrets.PYPI_PASS }}
          TEST_CICD_STATUS_TOKEN: ${{ secrets.TEST_CICD_STATUS_TOKEN }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          "${CICD_DIR}/travis/push-to-pypi.sh"

      - name: Record smoke result
        shell: bash
        run: |
          {
            echo "### Disposable production PyPI smoke passed"
            echo
            echo "- Package: noironetworks-acc-provision-release-smoke==${RELEASE_TAG}"
            echo "- SHA-256: ${{ needs.build.outputs.artifact_sha256 }}"
            echo "- Test release page: https://noironetworks.github.io/test-cicd-status/release.html?release=${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
