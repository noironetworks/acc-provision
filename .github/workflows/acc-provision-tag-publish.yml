name: acc-provision CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CICD_COMMIT: 34fb4932b027fb1776575c0918b1f9ca530b4929

jobs:
  run-unit-tests:
    name: Lint and unit tests
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.deleted == false && startsWith(github.ref, 'refs/heads/')))
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    concurrency:
      group: acc-provision-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: provision

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install package and test dependencies
        run: |
          python -m pip install flake8 coverage pytest
          python -m pip install .

      - name: Run flake8
        run: python -m flake8 --builtins="unicode" --ignore E501,E731,E741,W504 acc_provision

      - name: Run unit tests with coverage
        id: tests
        run: python -m coverage run --source=. -m pytest acc_provision --junitxml=test-results.xml

      - name: Generate coverage reports
        id: coverage
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Upload coverage to Coveralls
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: provision/coverage.xml
          format: cobertura
          base-path: provision
          fail-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acc-provision-test-reports
          path: |
            provision/test-results.xml
            provision/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build-and-publish:
    name: Prepare acc-provision package
    outputs:
      package-index: ${{ steps.route.outputs.index }}
      package-version: ${{ steps.route.outputs.version }}
      source-sha: ${{ steps.source.outputs.source_sha }}
      package-artifact: ${{ format('acc-provision-prepared-{0}-{1}', github.run_id, github.run_attempt) }}
      evidence-run-attempt: ${{ github.run_attempt }}
    if: github.event_name == 'push' && github.event.deleted == false && github.repository == 'noironetworks/acc-provision' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    concurrency:
      group: acc-provision-tag-${{ github.ref }}
      cancel-in-progress: false
    env:
      SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'mmr-6.1.1' }}
      UPSTREAM_ID: ${{ vars.UPSTREAM_ID }}
      CI_ARTIFACT_DIR: ci-artifacts
      TRAVIS_TAG: ${{ github.ref_name }}
      TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
      TRAVIS_JOB_WEB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TRAVIS_REPO_SLUG: ${{ github.repository }}
      ACC_PUBLICATION_MODE: ${{ vars.ACC_PUBLICATION_MODE }}
      PUBLICKEYFILE: ci/release-signing-key.asc

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive release identifiers from tag
        shell: bash
        run: |
          set -Eeuo pipefail

          # Trigger tag is the plain release tag (e.g. 6.1.1.7); UPSTREAM_ID comes from the repo variable.
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Trigger tag ${tag} is not a release tag of form N.N.N.N (e.g. 6.1.1.7)"
            exit 1
          }
          [[ -n "${UPSTREAM_ID}" ]] || {
            echo "::error::UPSTREAM_ID is empty; set the UPSTREAM_ID Actions variable on this repository (e.g. 81c2369)"
            exit 1
          }
          {
            echo "RELEASE_TAG=${tag}"
            echo "SAFE_TAG=${tag}"
          } >> "${GITHUB_ENV}"

      - name: Validate safe tag source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --force --no-tags origin \
            "+refs/tags/${SAFE_TAG}:refs/tags/${SAFE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${SAFE_TAG}")" == "tag" ]] || {
            echo "::error::Release tag ${SAFE_TAG} must be annotated"
            exit 1
          }

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          tagged_commit="$(git rev-parse "refs/tags/${SAFE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          source_commit="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          [[ "${tagged_commit}" == "${checked_out_commit}" ]] || {
            echo "::error::Tag ${SAFE_TAG} moved after this run was queued; refusing superseded run"
            exit 1
          }
          [[ "${tagged_commit}" == "${source_commit}" ]] || {
            echo "::error::Tag ${SAFE_TAG} resolves to ${tagged_commit}, not current ${SOURCE_BRANCH} head ${source_commit}"
            exit 1
          }

          echo "TRAVIS_COMMIT=${tagged_commit}" >> "${GITHUB_ENV}"
          echo "source_sha=${tagged_commit}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install tooling dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install pyyaml pytz twine

      - name: Clone CICD release scripts
        shell: bash
        run: |
          set -Eeuo pipefail

          cicd_dir="${RUNNER_TEMP}/cicd"
          [[ "${CICD_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::CICD_COMMIT must pin a reviewed full commit SHA"; exit 1;
          }
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${cicd_dir}" rev-parse HEAD)" == "${CICD_COMMIT}" ]] || {
            echo "::error::CICD checkout does not match reviewed pin"; exit 1;
          }
          cicd_release="$(sed -nE 's/^RELEASE_TAG="([^"]+)"/\1/p' "${cicd_dir}/travis/globals.sh")"
          [[ "${cicd_release}" == "${RELEASE_TAG}" ]] || {
            echo "::error::CICD release ${cicd_release} does not match ${RELEASE_TAG}"
            exit 1
          }
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"

      - name: Resolve explicit package publication mode
        id: route
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${CI_ARTIFACT_DIR}"
          python3 "${CICD_DIR}/travis/acc_publication_mode.py" \
            --mode "${ACC_PUBLICATION_MODE}" --repo . --tag "${SAFE_TAG}" \
            --actor "${GITHUB_ACTOR}" --triggering-actor "${GITHUB_TRIGGERING_ACTOR}" \
            --build-number "${GITHUB_RUN_NUMBER}" --output "${CI_ARTIFACT_DIR}/route.json"
          index="$(jq -r .index "${CI_ARTIFACT_DIR}/route.json")"
          version="$(jq -r .version "${CI_ARTIFACT_DIR}/route.json")"
          echo "index=${index}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "PYPI_TARGET=${index}" >> "${GITHUB_ENV}"
          if [[ "${index}" == pypi ]]; then
            [[ -f ci/release-inputs.json && -f "${PUBLICKEYFILE}" ]] || {
              echo "::error::Production requires the reviewed input lock and authorized public key"; exit 1;
            }
          fi

      - name: Build acc-provision package inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "${CI_ARTIFACT_DIR}"
          python -m pip install ./provision
          if [[ "${PYPI_TARGET}" == pypi ]]; then
            locked_aci="$(jq -er '.sources["noironetworks/aci-containers"]' ci/release-inputs.json)"
            [[ "${locked_aci}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Production requires a full locked ACI source SHA"; exit 1;
            }
            aci_dir="${RUNNER_TEMP}/acc-aci-containers"
            git init --quiet "${aci_dir}"
            git -C "${aci_dir}" remote add origin https://github.com/noironetworks/aci-containers.git
            git -C "${aci_dir}" fetch --depth=1 --no-tags origin "${locked_aci}"
            git -C "${aci_dir}" checkout --quiet --detach FETCH_HEAD
            actual_aci="$(git -C "${aci_dir}" rev-parse HEAD)"
            [[ "${actual_aci}" == "${locked_aci}" ]] || {
              echo "::error::ACI binary source differs from the approved input lock"; exit 1;
            }
            source_selection=locked-production-sha
          elif [[ "${PYPI_TARGET}" == testpypi ]]; then
            "${CICD_DIR}/travis/clone-aci-containers-repo.sh"
            aci_dir=/tmp/noironetworks/aci-containers
            git -C "${aci_dir}" fetch --force --no-tags origin \
              "+refs/tags/${SAFE_TAG}:refs/tags/${SAFE_TAG}"
            git -C "${aci_dir}" checkout -qf "${SAFE_TAG}"
            actual_aci="$(git -C "${aci_dir}" rev-parse HEAD)"
            source_selection=legacy-preview-tag
          else
            echo "::error::Unknown package index for ACI binary build"; exit 1;
          fi
          [[ "${actual_aci}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::ACI binary source identity is unavailable"; exit 1;
          }
          echo "ACTUAL_ACI_SOURCE_SHA=${actual_aci}" >> "${GITHUB_ENV}"
          python3 - "${CI_ARTIFACT_DIR}/acikubectl-source.json" "${actual_aci}" "${source_selection}" "${SAFE_TAG}" <<'PYCODE'
          import json, pathlib, sys
          path, sha, selection, trigger = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({'schema_version': 1, 'repository': 'noironetworks/aci-containers',
              'source_sha': sha, 'selection': selection, 'trigger_tag': trigger}, indent=2) + '\n')
          PYCODE
          pushd "${aci_dir}"
          "${CICD_DIR}/travis/show-git-repo-status.sh"
          make -C . dist-static/acikubectl
          popd

          cp "${aci_dir}/dist-static/acikubectl" provision/bin/acikubectl
          "${CICD_DIR}/travis/build-acc-provision.sh" | tee "${CI_ARTIFACT_DIR}/build-acc-provision.log"

      - name: Prepare package bytes and manifest without publication credentials
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/prepare-acc-package.py \
            --repo . --route "${CI_ARTIFACT_DIR}/route.json" --release-tag "${RELEASE_TAG}" \
            --upstream-id "${UPSTREAM_ID}" --artifact-dir "${CI_ARTIFACT_DIR}/package" \
            --output "${CI_ARTIFACT_DIR}/package-build.json"
          artifact="$(jq -r .artifact "${CI_ARTIFACT_DIR}/package-build.json")"
          version="$(jq -r .version "${CI_ARTIFACT_DIR}/package-build.json")"
          python3 -m twine check "${artifact}"
          python3 "${CICD_DIR}/travis/release_policy.py" package-manifest \
            --artifact "${artifact}" --name acc_provision --version "${version}" \
            --index "${PYPI_TARGET}" --source-sha "${TRAVIS_COMMIT}" \
            --aci-source-sha "${ACTUAL_ACI_SOURCE_SHA}" --cicd-commit "${CICD_COMMIT}" \
            --output "${CI_ARTIFACT_DIR}/package-manifest.json"
          echo "PACKAGE_ARTIFACT=${artifact}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify production publication prerequisites
        if: env.PYPI_TARGET == 'pypi'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 "${CICD_DIR}/travis/release_policy.py" collect-cohort-checks \
            --policy "${CICD_DIR}/travis/release-policy.json" --lock ci/release-inputs.json \
            --source-sha "${TRAVIS_COMMIT}" --output "${CI_ARTIFACT_DIR}/checks.json"
          python3 "${CICD_DIR}/travis/release_policy.py" inspect-inputs \
            --lock ci/release-inputs.json --output "${CI_ARTIFACT_DIR}/observations.json"
          python3 "${CICD_DIR}/travis/release_policy.py" authorize \
            --repo . --tag "${SAFE_TAG}" --policy "${CICD_DIR}/travis/release-policy.json" \
            --public-key "${PUBLICKEYFILE}" --lock ci/release-inputs.json \
            --checks "${CI_ARTIFACT_DIR}/checks.json" --observations "${CI_ARTIFACT_DIR}/observations.json" \
            --artifact-manifest "${CI_ARTIFACT_DIR}/package-manifest.json" \
            --output "${CI_ARTIFACT_DIR}/authorization.json"

      - name: Prepare immutable package status without publication credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          mode=z
          args=()
          if [[ "${PYPI_TARGET}" == pypi ]]; then
            mode=release
            git -c credential.helper= clone --quiet --branch main \
              https://github.com/noironetworks/cicd-status.git "${RUNNER_TEMP}/status-inputs"
            args+=(--status-checkout "${RUNNER_TEMP}/status-inputs")
          fi
          registry="https://test.pypi.org/project/acc-provision/${PACKAGE_VERSION}/#files"
          if [[ "${PYPI_TARGET}" == pypi ]]; then
            registry="https://pypi.org/project/acc-provision/${PACKAGE_VERSION}/#files"
          fi
          python3 "${CICD_DIR}/travis/ci_evidence.py" prepare-package \
            --artifact "${PACKAGE_ARTIFACT}" --bundle "${CI_ARTIFACT_DIR}/status-bundle" \
            --mode "${mode}" --version "${PACKAGE_VERSION}" --registry "${registry}" \
            --build-log "${CI_ARTIFACT_DIR}/build-acc-provision.log" \
            --release-tag "${RELEASE_TAG}" --source-repository "${GITHUB_REPOSITORY}" \
            --source-sha "${TRAVIS_COMMIT}" --run-id "${GITHUB_RUN_ID}" \
            --run-number "${GITHUB_RUN_NUMBER}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "${TRAVIS_JOB_WEB_URL}" --trigger-tag "${GITHUB_REF_NAME}" \
            --upstream-id "${UPSTREAM_ID}" "${args[@]}"

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acc-provision-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  upload-package:
    name: Upload prepared ACC package
    outputs:
      receipt-artifact: ${{ format('acc-provision-upload-{0}-{1}', github.run_id, github.run_attempt) }}
    needs: build-and-publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out validated source for production tag recheck
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared package and evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build-and-publish.outputs.package-artifact }}
          path: ci-artifacts
      - name: Load reviewed uploader
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install twine 'PyYAML==6.0.2'
          cicd_dir="${RUNNER_TEMP}/cicd"
          [[ "${CICD_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::CICD_COMMIT must pin a reviewed full commit SHA"; exit 1;
          }
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${cicd_dir}" rev-parse HEAD)" == "${CICD_COMMIT}" ]] || {
            echo "::error::CICD checkout does not match reviewed pin"; exit 1;
          }
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"
      - name: Resolve retained artifact path without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYCODE'
          import json, os, pathlib, re
          manifest = json.loads(pathlib.Path('ci-artifacts/package-manifest.json').read_text())
          filename = manifest['filename']
          if not re.fullmatch(r'acc_provision-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(?:\.dev[0-9]+)?\.tar\.gz', filename):
              raise SystemExit('Invalid retained package filename')
          artifact = pathlib.Path('ci-artifacts/package') / filename
          if artifact.is_symlink() or not artifact.is_file():
              raise SystemExit('Retained package bytes are missing')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PACKAGE_ARTIFACT=' + str(artifact) + '\n')
          PYCODE
      - name: Verify production inspection tooling
        if: needs.build-and-publish.outputs.package-index == 'pypi'
        shell: bash
        run: docker buildx version
      - name: Upload prepared preview package
        if: needs.build-and-publish.outputs.package-index == 'testpypi'
        shell: bash
        env:
          TWINE_USERNAME: '__token__'
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_PASS }}
        run: |
          set -Eeuo pipefail
          python3 "${CICD_DIR}/travis/release_policy.py" upload \
            --manifest ci-artifacts/package-manifest.json --artifact "${PACKAGE_ARTIFACT}" \
            --receipt ci-artifacts/upload-receipt.json
      - name: Upload authorized production package
        if: needs.build-and-publish.outputs.package-index == 'pypi'
        shell: bash
        env:
          TWINE_USERNAME: '__token__'
          TWINE_PASSWORD: ${{ secrets.PYPI_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 "${CICD_DIR}/travis/release_policy.py" upload \
            --manifest ci-artifacts/package-manifest.json --artifact "${PACKAGE_ARTIFACT}" \
            --receipt ci-artifacts/upload-receipt.json \
            --authorization ci-artifacts/authorization.json --repo . \
            --policy "${CICD_DIR}/travis/release-policy.json"
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acc-provision-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/upload-receipt.json
          if-no-files-found: error
          retention-days: 14

  publish-status:
    name: Publish prepared ACC status
    needs:
      - build-and-publish
      - upload-package
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TRAVIS_COMMIT: ${{ needs.build-and-publish.outputs.source-sha }}
      EVIDENCE_RUN_ATTEMPT: ${{ needs.build-and-publish.outputs.evidence-run-attempt }}
      EXPECTED_STATUS_STREAM: ${{ needs.build-and-publish.outputs.package-index == 'pypi' && github.ref_name || format('{0}.z', github.ref_name) }}
      EXPECTED_STATUS_IMAGES: ${{ needs.build-and-publish.outputs.package-index == 'pypi' && 'aci-containers-host,aci-containers-host-ovscni,aci-containers-controller,aci-containers-operator,aci-containers-webhook,aci-containers-certmanager,cnideploy,openvswitch,opflex' || '' }}
    steps:
      - name: Download prepared status bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build-and-publish.outputs.package-artifact }}
          path: ci-artifacts
      - name: Download verified upload receipt
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.upload-package.outputs.receipt-artifact }}
          path: ci-artifacts/receipt
      - name: Load reviewed status writer without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install pyyaml
          cicd_dir="${RUNNER_TEMP}/cicd"
          [[ "${CICD_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::CICD_COMMIT must pin a reviewed full commit SHA"; exit 1;
          }
          git init --quiet "${cicd_dir}"
          git -C "${cicd_dir}" remote add origin https://github.com/noironetworks/cicd.git
          git -C "${cicd_dir}" fetch --depth=1 origin "${CICD_COMMIT}"
          git -C "${cicd_dir}" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "${cicd_dir}" rev-parse HEAD)" == "${CICD_COMMIT}" ]] || {
            echo "::error::CICD checkout does not match reviewed pin"; exit 1;
          }
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"
      - name: Publish prepared package status
        shell: bash
        env:
          TRAVIS_TAGGER: ${{ secrets.GITHUBACTIONS_TAGGER }}
        run: |
          set -Eeuo pipefail
          python3 "${CICD_DIR}/travis/ci_evidence.py" publish \
            --bundle ci-artifacts/status-bundle \
            --receipt ci-artifacts/receipt/upload-receipt.json \
            --expected-release-tag "${GITHUB_REF_NAME}" --expected-kind package \
            --expected-stream "${EXPECTED_STATUS_STREAM}" \
            --expected-source-repository "${GITHUB_REPOSITORY}" --expected-source-sha "${TRAVIS_COMMIT}" \
            --expected-cicd-sha "${CICD_COMMIT}" --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-run-attempt "${EVIDENCE_RUN_ATTEMPT}" --expected-images "${EXPECTED_STATUS_IMAGES}" \
            --repository https://github.com/noironetworks/cicd-status.git --branch main
